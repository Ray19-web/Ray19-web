<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
<pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#fff" opacity=".14"/></pattern>
<clipPath id="c"><rect width="1200" height="440" rx="28"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.rise{opacity:0;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.d1{animation-delay:.2s}.d2{animation-delay:.5s}
.role{opacity:0;animation:role 9s infinite}
@keyframes role{0%{opacity:0;transform:translateY(12px)}6%,28%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-12px)}}
.r2{animation-delay:3s}.r3{animation-delay:6s}
.line{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2s .9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
</style>
<g clip-path="url(#c)">
<rect width="1200" height="440" fill="#080b16"/>
<circle r="190" fill="#7dd3fc" opacity=".35" filter="url(#b)" cx="220" cy="120"><animateTransform attributeName="transform" type="translate" values="0 0;160 70;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle r="210" fill="#a78bfa" opacity=".38" filter="url(#b)" cx="640" cy="420"><animateTransform attributeName="transform" type="translate" values="0 0;-120 -90;0 0" dur="17s" repeatCount="indefinite"/></circle>
<circle r="170" fill="#f0abfc" opacity=".28" filter="url(#b)" cx="1020" cy="110"><animateTransform attributeName="transform" type="translate" values="0 0;-140 80;0 0" dur="12s" repeatCount="indefinite"/></circle>
<rect width="1200" height="440" fill="url(#dots)"/>
<g transform="translate(1030 330)" opacity=".55">
<circle r="70" fill="none" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite"/></circle>
<circle r="40" fill="none" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="2 8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="20s" repeatCount="indefinite"/></circle>
<circle r="5" cx="70" fill="#f0abfc"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></circle>
</g>
<circle cx="160" cy="330" r="2.5" fill="#fff" class="tw"/><circle cx="260" cy="70" r="2" fill="#fff" class="tw" style="animation-delay:1s"/>
<circle cx="900" cy="60" r="2.5" fill="#fff" class="tw" style="animation-delay:2s"/><circle cx="1110" cy="230" r="2" fill="#fff" class="tw" style="animation-delay:1.5s"/>
<text x="600" y="130" text-anchor="middle" fill="#9aa4cf" font-size="15" letter-spacing="10" class="rise d1">HELLO WORLD, I'M</text>
<text x="600" y="235" text-anchor="middle" font-size="92" font-weight="800" letter-spacing="4" fill="url(#g)" class="rise d2">RAYMUND GORRES</text>
<path class="line" d="M390 272 H810" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
<g font-size="24" text-anchor="middle" fill="#dbe4ff">
<text x="600" y="330" class="role">Front-End Web Developer</text>
<text x="600" y="330" class="role r2">Building clean &amp; responsive interfaces</text>
<text x="600" y="330" class="role r3">Always learning. Always shipping.</text>
</g>
</g>
<rect x=".5" y=".5" width="1199" height="439" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>