<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 220" width="580" height="220">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient><filter id="b"><feGaussianBlur stdDeviation="26"/></filter><clipPath id="k"><rect x="4" y="4" width="572" height="212" rx="22"/></clipPath></defs>
<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.sw{stroke-dasharray:22 78;animation:s 6s linear infinite;animation-delay:-3.2s}@keyframes s{to{stroke-dashoffset:-100}}
.fl{animation:f 7s ease-in-out infinite}@keyframes f{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,16px)}}
.pu{animation:p 2s ease-in-out infinite}@keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
.ar{animation:a 2.2s ease-in-out infinite}@keyframes a{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
</style>
<rect x="4" y="4" width="572" height="212" rx="22" fill="#0c1020"/>
<g clip-path="url(#k)"><circle class="fl" cx="520" cy="40" r="80" fill="#a78bfa" opacity=".28" filter="url(#b)"/><circle class="fl" cx="60" cy="210" r="70" fill="#a78bfa" opacity=".22" filter="url(#b)" style="animation-delay:-3s"/></g>
<text x="544" y="120" text-anchor="end" font-size="110" font-weight="800" fill="#fff" opacity=".05">04</text>
<rect x="4" y="4" width="572" height="212" rx="22" fill="none" stroke="url(#g)" stroke-width="2" pathLength="100" class="sw"/>
<rect x="4.5" y="4.5" width="571" height="211" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>
<text x="36" y="62" font-size="14" letter-spacing="5" fill="#7dd3fc">PROJECT 04</text>
