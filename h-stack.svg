<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120">
<defs><linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient></defs>
<style>text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.a{opacity:0;animation:up 1s cubic-bezier(.2,.8,.2,1) .1s forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.l{stroke-dasharray:140;stroke-dashoffset:140;animation:d 1.6s .5s ease forwards}
@keyframes d{to{stroke-dashoffset:0}}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.3}50%{opacity:1}}
</style>
<text x="600" y="34" text-anchor="middle" font-size="14" letter-spacing="8" fill="#7dd3fc" class="a">02 — TOOLBOX</text>
<text x="600" y="82" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="3" fill="url(#g)" class="a" style="animation-delay:.25s">WHAT I BUILD WITH</text>
<path class="l" d="M530 104 H670" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
<circle cx="600" cy="104" r="3" fill="#f0abfc" class="p"/>
</svg>